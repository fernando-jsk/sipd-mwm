name: Deploy Laravel to cPanel (Single Zip Deploy)

on:
  push:
    branches:
      - main

# Cegah deploy bersamaan yang dapat memicu pembatasan koneksi FTP cPanel
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Install NPM & Build Assets
        run: |
          npm install
          npm run build

      # 1. Kemas seluruh aplikasi (core + public) menjadi 1 paket zip
      - name: Package Application into Single Zip
        run: |
          mkdir -p package/core package/public
          
          # Salin file core Laravel (abaikan git, node_modules, tests, public, package)
          rsync -av --exclude='.git*' \
                    --exclude='node_modules' \
                    --exclude='tests' \
                    --exclude='public' \
                    --exclude='package' \
                    --exclude='deploy-dist' \
                    --exclude='*.zip' \
                    ./ package/core/
          
          # Salin file public yang sudah ter-build (kecuali file symlink storage dan hot)
          rsync -av --exclude='hot' \
                    --exclude='storage' \
                    ./public/ package/public/

          # Sisipkan default cPanel MultiPHP handler (PHP 8.2) ke package/public/.htaccess agar tidak pernah ter-reset
          if ! grep -q "cPanel-generated handler" package/public/.htaccess; then
            {
              echo '# php -- BEGIN cPanel-generated handler, do not edit'
              echo '# Set the "ea-php82" package as the default "PHP" programming language.'
              echo '<IfModule mime_module>'
              echo '  AddHandler application/x-httpd-ea-php82 .php .php8 .phtml'
              echo '</IfModule>'
              echo '# php -- END cPanel-generated handler, do not edit'
              echo ''
            } > package/public/.htaccess.tmp
            cat package/public/.htaccess >> package/public/.htaccess.tmp
            mv package/public/.htaccess.tmp package/public/.htaccess
          fi
          
          # Kompresi menjadi deploy.zip
          cd package && zip -r ../deploy.zip core/ public/ && cd ..
          
          # Siapkan folder upload minimalis (deploy.zip dan deploy-helper.php terupdate)
          mkdir -p deploy-dist/public_html
          mv deploy.zip deploy-dist/
          cp public/deploy-helper.php deploy-dist/public_html/deploy-helper.php

      # 2. Upload Single Zip via FTP dengan Auto-Retry (Hingga 4x percobaan jika socket data terputus)
      - name: Upload Single Deploy Package
        uses: Wandalen/wretry.action@v3
        with:
          action: SamKirkland/ftp-deploy-action@v4.3.5
          attempt_limit: 4
          attempt_delay: 15s
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            protocol: ftps
            port: 21
            security: loose
            log-level: verbose
            local-dir: ./deploy-dist/
            server-dir: /



      # 3. Trigger Remote Unzip, Migrasi Database, & Cache Refresh via HTTP Webhook
      - name: Trigger Remote Extract & Deploy
        run: |
          SECRET_KEY="${{ secrets.DEPLOY_SECRET_KEY }}"
          if [ -z "$SECRET_KEY" ]; then
            SECRET_KEY="sipd-mwm-deploy-key-2026"
          fi
          
          echo "Memanggil script deploy helper di server cPanel..."
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://saskia.web.id/deploy-helper.php?key=${SECRET_KEY}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Respon Server (HTTP $HTTP_CODE):"
          echo "$BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Ekstraksi deploy di server gagal dengan status HTTP $HTTP_CODE!"
            exit 1
          fi
          
          echo "Deploy berhasil selesai!"