name: Deploy Laravel to cPanel (Fast Zip Method)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Install NPM & Build Assets
        run: |
          npm install
          npm run build

      # 1. Compress folder vendor menjadi 1 file zip agar upload super cepat
      - name: Zip Vendor Directory
        run: |
          zip -r vendor.zip vendor/

      # 2. Deploy Core App (Abaikan folder vendor uncompressed, hanya upload vendor.zip)
      - name: Deploy Core App
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /laravel-app/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            vendor/**
            public/**

      # 3. Trigger Unzip via URL HTTP ke cPanel
      - name: Trigger Remote Unzip
        run: |
          curl -s "https://domainanda.com/../laravel-app/unzip.php?key=my-secret-key-123" || true
          # Catatan: Sesuaikan URL di atas atau buat route khusus jika perlu.

      # 4. Deploy Public Assets
      - name: Deploy Public Folder
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /public_html/